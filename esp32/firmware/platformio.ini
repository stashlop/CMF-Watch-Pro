; Omnitrix firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06
; (ESP32-S3R8: 8 MB octal PSRAM, QSPI flash; CO5300 410x502 AMOLED, FT3168 touch, PCF85063 RTC, AXP2101 PMU)
;
;   python -m esp32.assets          ; render the asset pack into data/ (run first)
;   pio run -t upload               ; firmware
;   pio run -t uploadfs             ; asset pack (LittleFS)

[platformio]
default_envs = omnitrix

[env:omnitrix]
; Arduino-ESP32 3.2.0 (Waveshare requires >= 3.2.0 for this board's libraries)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Same flash setup as Waveshare's own demos: 16 MB QIO, octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2

; Versions as listed on the Waveshare wiki for this board (JPEGDEC: the release before the newest)
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    bitbank2/JPEGDEC @ 1.8.4
    lewisxhe/SensorLib @ 0.3.1
    lewisxhe/XPowersLib @ 0.2.6

monitor_speed = 115200
upload_speed = 921600
